name: Kompilacja Windows

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  exe:
    name: Jeden plik exe (win-x64)
    runs-on: windows-latest
    steps:
      - name: Kod
        uses: actions/checkout@v4

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Testy
        run: dotnet test KosZawal.sln -c Release --nologo

      - name: Publikacja bez instalatora
        run: >
          dotnet publish src/KosZawal/KosZawal.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o dist

      - name: Artefakt KosZawal.exe
        uses: actions/upload-artifact@v4
        with:
          name: KosZawal-win-x64
          path: dist/KosZawal.exe
          if-no-files-found: error
